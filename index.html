<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;padding:0}</style></head><body><title>Blocky Builder Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Blocky Builder Online — landscape tablet app shell.
   Design tokens follow 화면 기획안 v9: ink purple frame, level-colour tint, role-coloured blocks. Single light look by design. */
:root{
  --ink:#2B1E63; --ink-soft:#7A738F; --paper:#F7FAFC; --line:#E3E8F0; --card:#FFFFFF;
  --teal:#1FA6A7; --teal-d:#167F80; --sun:#FFC332; --sun-d:#B8860B; --sun-tint:#FFF8E6; --sun-pill:#F3B61F;
  --subj:#5BAEE6; --verb:#F48A96; --obj:#8CC63F; --comp:#9B7FC7; --time:#F37021; --key:#9B7FC7;
  --ok:#47B973; --bad:#E5484D; --navy:#1B1540; --mic:#3B82F6;
  --f-kr:'Noto Sans KR','Apple SD Gothic Neo',sans-serif; --f-en:'Fredoka','Noto Sans KR',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--ink);font-family:var(--f-kr);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* device frame: 16:10 landscape, scales to viewport */
.device{position:relative;width:min(100%,calc((100vh - 24px) * 1.6));aspect-ratio:16/10;max-height:calc(100vh - 24px);background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;font-size:calc(var(--u) * 1px)}
/* --u = 1/928 of device width, set by JS */

/* header */
.hdr{flex:0 0 auto;height:calc(var(--u)*44px);background:#fff;display:flex;align-items:center;gap:calc(var(--u)*12px);padding:0 calc(var(--u)*18px);border-bottom:1px solid var(--line)}
.hdr .back{border:0;background:var(--paper);border:1.5px solid var(--line);border-radius:50%;width:calc(var(--u)*34px);height:calc(var(--u)*34px);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;padding:0}
.hdr .back svg,.next svg{width:55%;height:55%;display:block}
.hdr .brand{font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*17.7px)}
.hdr .crumb a{color:var(--ink-soft);text-decoration:none;cursor:pointer}.hdr .crumb a:hover{text-decoration:underline}
.hdr .crumb{font-size:calc(var(--u)*13px);color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tog{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.tog button{border:0;background:transparent;border-radius:999px;padding:calc(var(--u)*3px) calc(var(--u)*10px);font-weight:700;font-size:calc(var(--u)*11.8px);cursor:pointer;color:var(--ink-soft)}
.tog button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tog.cc button[aria-pressed="true"]{background:var(--ink)}

/* stage band */
.band{flex:0 0 auto;height:calc(var(--u)*40px);background:color-mix(in srgb,var(--sun) 22%,#fff);display:flex;align-items:center;padding:0 calc(var(--u)*16px);gap:calc(var(--u)*8px)}
.band span{flex:1;text-align:center;font-size:calc(var(--u)*14.2px);color:var(--ink-soft);padding:calc(var(--u)*5px) 0;border-radius:999px;white-space:nowrap;font-weight:500}
.band span.done{color:var(--ink)}
.band span.now{background:var(--sun-pill);color:var(--ink);font-weight:700;font-size:calc(var(--u)*14.8px)}

/* body */
.body{flex:1 1 auto;min-height:0;position:relative;background:var(--sun-tint);padding:calc(var(--u)*14px) calc(var(--u)*30px) 0;display:flex;flex-direction:column;gap:calc(var(--u)*12px)}
.card{background:var(--card);border-radius:calc(var(--u)*16px);box-shadow:0 2px 8px rgba(43,30,99,.06)}

/* bottom line: cubi+bubble | mic | next */
.foot{flex:0 0 auto;height:calc(var(--u)*96px);position:relative;display:flex;align-items:center;padding:0 calc(var(--u)*30px);gap:calc(var(--u)*10px);background:var(--sun-tint)}
.cubi{position:relative;display:inline-block;line-height:0;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.cubi img{height:100%;width:auto;display:block}
.cubi .patch{position:absolute;width:19%;aspect-ratio:2.1;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;filter:blur(.6px)}
.cubi.talking .patch{opacity:1}
.cubi .mouth{position:absolute;width:10%;aspect-ratio:1.7;background:#1B1540;border-radius:40% 40% 50% 50%/35% 35% 65% 65%;transform:translate(-50%,-35%) scaleY(0);transform-origin:50% 20%;opacity:0;pointer-events:none}
.cubi .mouth::after{content:"";position:absolute;left:22%;right:22%;bottom:8%;height:40%;background:#F48A96;border-radius:50% 50% 40% 40%}
.cubi.talking .mouth{animation:talk .34s ease-in-out infinite alternate}
@keyframes talk{0%{transform:translate(-50%,-35%) scaleY(.18);opacity:1}100%{transform:translate(-50%,-35%) scaleY(1);opacity:1}}
.cubi-sm{height:calc(var(--u)*100px);margin-top:calc(var(--u)*-16px);flex:none}
.cap{position:absolute;left:calc(var(--u)*30px);max-width:calc(100% - var(--u)*190px);top:50%;transform:translateY(-50%);display:flex;align-items:center;font-size:calc(var(--u)*17px);line-height:1.45;color:var(--ink);font-weight:500;background:#fff;border:1.5px solid var(--line);border-radius:calc(var(--u)*16px);padding:calc(var(--u)*13px) calc(var(--u)*20px);box-shadow:0 2px 8px rgba(43,30,99,.06)}
.cap b{font-family:var(--f-en);color:var(--teal-d)}
.cap[hidden]{display:none}
.replay{position:absolute;right:calc(var(--u)*96px);top:50%;transform:translateY(-50%);width:calc(var(--u)*44px);height:calc(var(--u)*44px);border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--ink-soft)}
.replay svg{width:55%;height:55%}
.bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:calc(var(--u)*14px);padding:calc(var(--u)*8px) calc(var(--u)*14px);font-size:calc(var(--u)*14.8px);line-height:1.4;max-width:calc(var(--u)*280px);min-height:calc(var(--u)*40px);display:flex;align-items:center;box-shadow:0 2px 8px rgba(43,30,99,.06)}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble b{font-family:var(--f-en);font-weight:700;color:var(--teal-d)}
.bubble[hidden]{display:none}
.mic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--u)*64px);height:calc(var(--u)*64px);border-radius:50%;border:3px solid var(--mic);background:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 calc(var(--u)*10px) rgba(59,130,246,.18);transition:opacity .25s,transform .25s}
.mic::after{content:"";width:0;height:0;border-left:calc(var(--u)*20px) solid var(--mic);border-top:calc(var(--u)*12px) solid transparent;border-bottom:calc(var(--u)*12px) solid transparent;margin-left:calc(var(--u)*5px)}
.mic.rec{border-color:var(--bad);box-shadow:0 0 0 calc(var(--u)*10px) rgba(229,72,77,.22);animation:pulse 1s infinite}
.mic.rec::after{border:0;width:calc(var(--u)*18px);height:calc(var(--u)*18px);background:var(--bad);border-radius:3px;margin:0}
.mic.hide{opacity:0;pointer-events:none;transform:translate(-50%,-30%)}
.mic-hint{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 calc(var(--u)*18px) rgba(229,72,77,0)}}
.next{margin-left:auto;width:calc(var(--u)*52px);height:calc(var(--u)*52px);border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;color:#C9CFD9;display:grid;place-items:center;padding:0}
.next.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* blocks */
.blk{position:relative;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-en);font-weight:600;color:#fff;border-radius:calc(var(--u)*12px);padding:0 calc(var(--u)*18px);height:calc(var(--u)*56px);min-width:calc(var(--u)*80px);font-size:calc(var(--u)*22px);box-shadow:0 calc(var(--u)*6px) 0 rgba(0,0,0,.22);user-select:none;transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.blk.subj{background:var(--subj)}.blk.verb{background:var(--verb)}.blk.obj{background:var(--obj)}.blk.comp{background:var(--comp)}.blk.time{background:var(--time)}
.blk.ghost{background:#fff;box-shadow:none;border:2px dashed currentColor;color:var(--subj)}
.blk.ghost.verb{color:var(--verb)}.blk.ghost.obj{color:var(--obj)}
.blk small{position:absolute;left:0;right:0;top:100%;margin-top:calc(var(--u)*8px);font-family:var(--f-kr);font-weight:700;font-size:calc(var(--u)*13px);text-align:center}
.blk.subj small{color:var(--subj)}.blk.verb small{color:var(--verb)}
.blk.drop{transform:translateY(calc(var(--u)*-260px));opacity:0}
.row{display:flex;gap:calc(var(--u)*8px);align-items:center;justify-content:center}

@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025) translateY(-1px)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-14%) scaleY(1.05)}70%{transform:translateY(0) scaleY(.94)}100%{transform:translateY(0)}}
.jump{animation:jump .7s cubic-bezier(.3,1.4,.5,1) 1 !important}

/* ---- Block Town ---- */
.town{background:#FFF3C4}
.town h1{margin:0;font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*32px);color:var(--ink);line-height:1}
.town .sub{font-size:calc(var(--u)*13px);font-weight:700;color:var(--sun-d);margin-top:calc(var(--u)*4px)}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*14px);margin-top:calc(var(--u)*12px)}
.lv{position:relative;border:0;border-radius:calc(var(--u)*20px);height:calc(var(--u)*210px);background:#E9E7F0;box-shadow:0 calc(var(--u)*8px) 0 #B9B3CC;cursor:default;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--u)*14px);color:#B9B3CC;transition:transform .15s}
.lv.open{background:#fff;box-shadow:0 calc(var(--u)*8px) 0 #C9A227;border:2px solid var(--sun);color:var(--ink);cursor:pointer}
.lv.now{background:var(--sun)}
.lv:active{transform:translateY(4px)}
.lv .kw{font-size:calc(var(--u)*10.6px);font-weight:700;letter-spacing:.5px}
.lv.open:not(.now) .kw{color:var(--sun-d)}
.lv .n{font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*54px);line-height:1.1}
.lv .st{margin-top:auto;margin-bottom:calc(var(--u)*14px);font-size:calc(var(--u)*12.4px);font-weight:700}
.lv .bar{width:70%;height:calc(var(--u)*7px);background:#fff;border-radius:99px;overflow:hidden;margin-bottom:calc(var(--u)*6px)}
.lv .bar i{display:block;height:100%;background:var(--ink);width:20%}
.games{margin-top:calc(var(--u)*26px);margin-bottom:auto}
.games .lbl{font-size:calc(var(--u)*11.2px);font-weight:700;color:var(--sun-d);margin-bottom:calc(var(--u)*6px)}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*16px)}
.gt{position:relative;border:0;border-radius:calc(var(--u)*18px);height:calc(var(--u)*116px);color:#fff;display:flex;align-items:center;gap:calc(var(--u)*12px);padding:0 calc(var(--u)*14px);cursor:pointer;text-align:left;box-shadow:0 calc(var(--u)*8px) 0 #0F0B2A;transition:transform .15s}
.gt:active{transform:translateY(4px)}
.gt .ic{width:calc(var(--u)*80px);height:calc(var(--u)*80px);border-radius:calc(var(--u)*14px);background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none;font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*36px)}
.gt .ic .mini{display:flex;flex-direction:column;gap:3px;align-items:center}
.gt .ic .mini i{display:block;height:calc(var(--u)*12px);border-radius:4px}
.gt .t{font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*16.5px)}
.gt .d{font-size:calc(var(--u)*11.2px);opacity:.8}
.gt .play{margin-top:calc(var(--u)*8px);display:flex;align-items:center;gap:calc(var(--u)*10px)}
.gt .play b{background:var(--sun);color:var(--ink);border-radius:999px;padding:calc(var(--u)*4px) calc(var(--u)*12px);font-size:calc(var(--u)*11.2px)}
.gt .play span{font-size:calc(var(--u)*10.6px);font-weight:700;opacity:.85}

/* ---- Level units ---- */
.units{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*16px);margin-top:calc(var(--u)*14px)}
.un{border:0;border-radius:calc(var(--u)*18px);height:calc(var(--u)*170px);background:#E9E7F0;box-shadow:0 calc(var(--u)*8px) 0 #B9B3CC;color:#9A96AD;display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*14px) calc(var(--u)*10px) 0;text-align:center;transition:transform .15s}
.un.open{background:#fff;box-shadow:0 calc(var(--u)*8px) 0 #C9A227;border:2px solid var(--sun);color:var(--ink);cursor:pointer}
.un.now{background:var(--sun)}
.un:active{transform:translateY(4px)}
.un .t{font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*17.7px)}
.un .g{font-size:calc(var(--u)*11.8px);margin-top:calc(var(--u)*6px);color:inherit;opacity:.8}
.un .st{margin-top:auto;margin-bottom:calc(var(--u)*14px);font-size:calc(var(--u)*11.8px);font-weight:700}
.un .st.btn{background:var(--ink);color:#fff;border-radius:999px;padding:calc(var(--u)*6px) calc(var(--u)*16px)}
.results{margin-top:auto;margin-bottom:calc(var(--u)*14px);background:#fff;border:1.5px solid var(--line);border-radius:calc(var(--u)*18px);padding:calc(var(--u)*14px) calc(var(--u)*20px) calc(var(--u)*12px);display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:calc(var(--u)*10px);align-items:center}
.results .k{font-size:calc(var(--u)*11.2px);color:var(--ink-soft)}
.results .v{font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*24px);color:var(--teal-d)}
.results .rb{border:1.5px solid var(--teal);background:#EAF6F6;color:var(--teal-d);border-radius:999px;padding:calc(var(--u)*8px) calc(var(--u)*14px);font-size:calc(var(--u)*11.2px);font-weight:700;cursor:pointer}
.results .prog{grid-column:1/-1;height:calc(var(--u)*8px);background:var(--line);border-radius:99px;overflow:hidden}
.results .prog i{display:block;height:100%;width:20%;background:var(--sun)}

/* ---- Warm-Up ---- */
.wu-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(var(--u)*6px);gap:calc(var(--u)*6px)}
.wu-stage .cubi{height:calc(var(--u)*250px);max-height:100%}
.foot.nocubi .cubi-sm,.foot.nocubi .bubble{display:none}
.wu-card .row .blk{height:calc(var(--u)*68px);font-size:calc(var(--u)*30px);padding:0 calc(var(--u)*24px);min-width:calc(var(--u)*86px);border-radius:calc(var(--u)*14px)}
.wu-title{font-size:calc(var(--u)*18.9px);font-weight:900;color:var(--sun-d)}
.wu-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center;column-gap:calc(var(--u)*34px);row-gap:calc(var(--u)*12px);padding:calc(var(--u)*18px) calc(var(--u)*30px);min-height:calc(var(--u)*110px)}
.wu-card .ko{font-size:calc(var(--u)*14.5px*var(--ko-scale,1));font-weight:700;line-height:1.3}
.dots{flex-basis:100%;display:flex;gap:calc(var(--u)*10px);justify-content:center;margin-top:calc(var(--u)*14px)}
.dots i{width:calc(var(--u)*12px);height:calc(var(--u)*12px);border-radius:50%;background:#E3D9B8}
.dots i.on{background:var(--sun-d)}


/* ---- Cubi Time ---- */
.ct-body{background:var(--sun-tint);padding-bottom:0}
.stageN{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 95%,#2D2466 0%,#1B1540 70%);border-radius:calc(var(--u)*18px);overflow:hidden;display:grid;grid-template-columns:1fr calc(var(--u)*270px)}
.stageN .ttl{position:absolute;left:calc(var(--u)*22px);top:calc(var(--u)*14px);font-size:calc(var(--u)*17px);font-weight:900;color:#8FD8D8;z-index:2}
.stageN .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#241C55,#1B1540);border-top:2px solid #3A2F7A}
.stageN .cnt{position:absolute;right:calc(var(--u)*20px);top:calc(var(--u)*12px);font-size:calc(var(--u)*11px);color:#8FD8D8}
.stageN .arena{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*34px);padding:calc(var(--u)*30px) calc(var(--u)*20px) calc(var(--u)*80px)}
.echo{display:flex;align-items:baseline;gap:calc(var(--u)*16px);min-height:calc(var(--u)*44px);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.echo.show{opacity:1;transform:none}
.echo .en{font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*30px);color:#FFE38A;line-height:1.1}
.echo .ko{font-size:calc(var(--u)*20px);font-weight:700;color:#E8E3FF}
.stageN .cubiR{display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--u)*18px)}
.stageN .cubiR .cubi{height:calc(var(--u)*220px)}
.stageN .prog{position:absolute;left:calc(var(--u)*20px);right:calc(var(--u)*300px);bottom:calc(var(--u)*14px);height:calc(var(--u)*6px);background:#3A2F7A;border-radius:99px;overflow:hidden}
.stageN .prog i{display:block;height:100%;background:var(--teal);width:0;transition:width .6s}
.stageN .blk small{color:#BFD8D8}
.stageN .blk.subj small{color:#BFD8D8}.stageN .blk.verb small{color:#BFD8D8}
.stageN .msg{position:absolute;left:0;right:calc(var(--u)*270px);bottom:calc(var(--u)*34px);text-align:center;color:var(--verb);font-weight:700;font-size:calc(var(--u)*13px);opacity:0;transition:opacity .3s}
.stageN .msg.show{opacity:1}
.slots{display:flex;gap:calc(var(--u)*8px);align-items:flex-start;justify-content:center;min-height:calc(var(--u)*76px)}
.slots .blk{height:calc(var(--u)*70px);font-size:calc(var(--u)*30px);padding:0 calc(var(--u)*26px);min-width:calc(var(--u)*86px);border-radius:calc(var(--u)*14px);box-shadow:0 calc(var(--u)*8px) 0 rgba(0,0,0,.28)}
.slots .blk small{margin-top:calc(var(--u)*12px)}
.slots .blk{transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.slots .blk.wob{animation:wob .5s ease-in-out 2}
.slots .blk.fall{animation:fall .9s ease-in forwards}
.slots.swap .blk:nth-child(1){transform:translateX(calc(100% + var(--u)*8px))}
.slots.swap .blk:nth-child(2){transform:translateX(calc(-100% - var(--u)*8px))}
@keyframes wob{0%,100%{rotate:0deg}25%{rotate:-5deg}75%{rotate:5deg}}
@keyframes fall{0%{opacity:1}100%{transform:translateY(calc(var(--u)*220px)) rotate(18deg);opacity:0}}
.gridN{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*22px) calc(var(--u)*40px)}
.gridN .row{display:flex;align-items:center;gap:calc(var(--u)*6px)}
.gridN .row .blk{font-size:calc(var(--u)*24px);height:calc(var(--u)*56px);min-width:calc(var(--u)*72px);padding:0 calc(var(--u)*20px);box-shadow:0 calc(var(--u)*6px) 0 rgba(0,0,0,.28)}
.flash{animation:flash .5s}
@keyframes flash{0%{filter:brightness(1.4)}100%{filter:none}}
/* tap check */
.check{position:absolute;inset:0;z-index:5;background:rgba(27,21,64,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*20px);padding:calc(var(--u)*20px)}
.check h3{margin:0;color:#fff;font-size:calc(var(--u)*18px);font-weight:900;text-align:center}
.check .opts{display:flex;gap:calc(var(--u)*28px);flex-wrap:wrap;justify-content:center;align-items:flex-end}
.check .opt{border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10px)}
.check .abc{font-family:var(--f-kr);font-weight:700;font-size:calc(var(--u)*20px);color:#FFE38A;line-height:1}
.check .q{color:#FFE38A;font-family:var(--f-en);margin-right:calc(var(--u)*4px)}
.check h3 b{color:#8FD8D8}
.check .opt .pair{display:flex;gap:calc(var(--u)*6px)}
.check .opt.wrong{animation:shake .5s}.check .opt.right{animation:pop .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.12)}}
.check .fb{min-height:calc(var(--u)*22px);color:#BFD8D8;font-weight:700;font-size:calc(var(--u)*13px)}
.check .fb.ok{color:var(--ok)}.check .fb.no{color:var(--verb)}

/* ---- Block Build ---- */
.bb-top{display:flex;align-items:center;justify-content:space-between}

.bb-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*24px);flex:1;min-height:0;padding:calc(var(--u)*20px) calc(var(--u)*30px);position:relative}
.bb-card .ko{font-size:calc(var(--u)*18px*var(--ko-scale,1));font-weight:700;color:var(--ink)}
.bb-slots{display:flex;gap:calc(var(--u)*8px);align-items:center}
.bb-slots .blk{height:calc(var(--u)*70px);font-size:calc(var(--u)*30px);padding:0 calc(var(--u)*26px);min-width:calc(var(--u)*86px);border-radius:calc(var(--u)*14px);box-shadow:0 calc(var(--u)*8px) 0 rgba(0,0,0,.22)}
.bb-slots .hole{height:calc(var(--u)*70px);min-width:calc(var(--u)*110px);border-radius:calc(var(--u)*14px);border:3px dashed var(--line);background:rgba(255,255,255,.6);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:calc(var(--u)*28px);color:#C9C2DC;transition:background .2s,border-color .2s}
.bb-slots .hole.subj{border-color:var(--subj);background:#EAF4FC;color:var(--subj)}.bb-slots .hole.verb{border-color:var(--verb);background:#FDEEF0;color:var(--verb)}
.bb-slots .hole.no{animation:shake .45s;border-color:#E05A5A}
.bb-tray{display:flex;gap:calc(var(--u)*18px);padding:calc(var(--u)*18px) calc(var(--u)*26px) calc(var(--u)*22px);background:#F1EEF9;border:1.5px solid #E0DAF0;border-radius:calc(var(--u)*18px);position:relative;margin-top:calc(var(--u)*6px)}

.bb-slots{padding:calc(var(--u)*16px) calc(var(--u)*24px);background:#FFFDF7;border-radius:calc(var(--u)*18px);border:1.5px dashed #EDE4C8}
.bb-tray .blk{cursor:pointer;height:calc(var(--u)*62px);font-size:calc(var(--u)*26px);padding:0 calc(var(--u)*22px);min-width:calc(var(--u)*86px)}
.bb-tray .blk:active{transform:translateY(3px)}

.foot:has(.mic) .cap{max-width:calc(50% - var(--u)*60px)}

/* ---- Speak & Stack ---- */
.ss-wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr calc(var(--u)*150px);gap:calc(var(--u)*14px)}
.ss-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*22px);padding:calc(var(--u)*20px) calc(var(--u)*30px);position:relative}
.ss-card .ko{font-size:calc(var(--u)*18px*var(--ko-scale,1));font-weight:700;color:var(--ink)}
.ss-blocks{display:flex;gap:calc(var(--u)*8px);align-items:flex-start;min-height:calc(var(--u)*76px)}
.ss-blocks .blk{height:calc(var(--u)*70px);font-size:calc(var(--u)*30px);padding:0 calc(var(--u)*26px);min-width:calc(var(--u)*86px);border-radius:calc(var(--u)*14px);box-shadow:0 calc(var(--u)*8px) 0 rgba(0,0,0,.22);transition:opacity .3s,outline .2s}

.ss-cnt{display:flex;justify-content:space-between;align-items:center}
.ss-nostt{font-size:calc(var(--u)*12px);color:#E05A5A;font-weight:700}

.ph{flex:1;display:grid;place-items:center;color:var(--ink-soft);font-size:calc(var(--u)*15.3px);text-align:center;line-height:1.6}

<script>
/* ================= data ================= */
const A=JSON.parse(document.getElementById('assets').textContent);
const UNITS={'L1-B1-U1':JSON.parse(document.getElementById('unit-L1-B1-U1').textContent)};
const LEVELS=[['1','BUILD'],['2','SHAPE'],['3','EXPAND'],['4','SHIFT'],['5','CONNECT'],['6','CONTROL']];
const L1_UNITS=[['Unit 1','주인공 + 동작','L1-B1-U1'],['Unit 2','주인공 + 동작 + 대상',null],['Unit 3','명사 블록',null],['Unit 4','대명사 블록',null],['Unit 5','be동사 (1)',null]];
const STAGES=['Warm-Up','Cubi Time','Block Build','Speak & Stack','Talk to Cubi','Wrap Up'];

/* ================= state ================= */
const S={lang:'ko',cc:true,route:'town',unit:null,stage:0,idx:0};
try{const p=JSON.parse(localStorage.getItem('bb.progress')||'{}');S.progress=p;}catch(e){S.progress={};}
S.progress=S.progress||{};
const save=()=>{try{localStorage.setItem('bb.progress',JSON.stringify(S.progress));}catch(e){}};
const T=(o)=>o?(S.lang==='ko'?o.ko:o.en):'';
const $=s=>document.querySelector(s);
const app=$('#app');

/* ================= scaling ================= */
function fit(){const w=$('#device').clientWidth;app.style.setProperty('--u',(w/928).toFixed(4));}
new ResizeObserver(fit).observe($('#device'));fit();

/* ================= speech ================= */
const synth=window.speechSynthesis;let voices=[];
if(synth){voices=synth.getVoices();synth.onvoiceschanged=()=>voices=synth.getVoices();}
const pick=l=>{const re=l==='ko'?/ko/i:/en[-_]?(US|GB)/i;return voices.find(v=>re.test(v.lang)&&/Google|Yuna|Samantha|Natural|Premium|Siri/i.test(v.name))||voices.find(v=>re.test(v.lang))||null;};
const isEn=t=>/^[A-Za-z0-9 ,.'!?\-]+$/.test(t);
function segs(text){const out=[];text.replace(/…/g,'[pause:700]').split(/(\*\*[^*]+\*\*|\[pause\]|\[pause:\d+\])/g).forEach(p=>{if(!p)return;const pm=p.match(/^\[pause(?::(\d+))?\]$/);if(pm){out.push({pause:pm[1]?+pm[1]:1500});return;}let t=p.startsWith('**')?p.slice(2,-2):p;t=t.replace(/[—…"]/g,' ').replace(/\s+/g,' ').trim();if(!t)return;const en=isEn(t);if(en&&/^I[.!,]?$/.test(t))t='Eye';out.push({t,en});if(/,$/.test(t))out.push({pause:450});});return out;}
let speakToken=0;
function speak(text,done=()=>{},onSeg=null){const tok=++speakToken;const fin0=()=>{setTalking(false);done();};if(!synth){setTalking(true);setTimeout(fin0,Math.max(1500,text.length*60));return;}
  synth.cancel();const list=segs(text);let i=0;
  const next=()=>{if(tok!==speakToken){setTalking(false);return;}if(i>=list.length){fin0();return;}const s=list[i++];if(s.pause){setTalking(false);setTimeout(next,s.pause);return;}setTalking(true);if(onSeg)try{onSeg(s);}catch(e){}const u=new SpeechSynthesisUtterance(s.t);u.lang=s.en?'en-US':'ko-KR';const v=pick(s.en?'en':'ko');if(v)u.voice=v;u.rate=s.en?0.85:1;u.pitch=1.15;
    let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(wd);setTimeout(next,60);};u.onend=end;u.onerror=end;const wd=setTimeout(()=>{if(!fin){fin=true;synth.cancel();setTimeout(next,80);}},Math.max(2500,s.t.length*250));synth.speak(u);};
  next();}
function stopSpeech(){speakToken++;setTalking(false);if(synth)synth.cancel();}

/* ================= sfx (Web Audio, no files) ================= */
let AC=null;const ac=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;};
function tone(f,dur,type='sine',gain=.18,when=0){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+when);g.gain.linearRampToValueAtTime(gain,c.currentTime+when+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+when+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+when);o.stop(c.currentTime+when+dur+.02);}
const SFX={micOn:()=>{tone(660,.12);tone(880,.18,'sine',.18,.1);},recStart:()=>{tone(520,.1,'triangle');},recStop:()=>{tone(880,.08,'triangle');tone(660,.14,'triangle',.18,.08);},ok:()=>{tone(523,.1);tone(659,.1,'sine',.18,.1);tone(784,.22,'sine',.2,.2);},bad:()=>{tone(300,.18,'sawtooth',.12);tone(240,.25,'sawtooth',.12,.15);},tap:()=>{tone(1000,.05,'square',.06);},click:()=>{tone(2200,.025,'square',.14);tone(900,.06,'triangle',.16,.03);tone(1400,.05,'sine',.1,.1);}};

document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.lv,.un,.gt,.opt,.tog'))SFX.tap();},true);
/* ================= helpers ================= */
const el=(tag,cls,html)=>{const d=document.createElement(tag);if(cls)d.className=cls;if(html!==undefined)d.innerHTML=html;return d;};
const md=t=>t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

function cubi(pose,id,cls){const w=el('div','cubi'+(cls?' '+cls:''));if(id)w.id=id;const im=el('img');im.src=A[pose];im.alt='Cubi';w.appendChild(im);const m=MOUTH[pose];if(m){const pa=el('i','patch');pa.style.left=m[0]+'%';pa.style.top=m[3]+'%';pa.style.background=m[2];w.appendChild(pa);const mo=el('i','mouth');mo.style.left=m[0]+'%';mo.style.top=m[1]+'%';w.appendChild(mo);}return w;}
function setTalking(on){document.querySelectorAll('.cubi').forEach(c=>c.classList.toggle('talking',!!on));}
function blk(text,role,sub){const d=el('div','blk '+role,text+(sub?'<small>'+sub+'</small>':''));return d;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

/* header + band */
function header(crumb,opts={}){const h=el('div','hdr');
  h.innerHTML=(opts.back?`<button class="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`:'')+`<div class="brand">Blocky Builder</div><div class="crumb">${crumb||''}</div>`;
  if(opts.back){h.querySelector('.back').onclick=()=>{stopSpeech();opts.back();};}
  h.querySelectorAll('.crumb a').forEach(a=>a.onclick=()=>{stopSpeech();const r=a.dataset.go;if(r==='town'){S.route='town';}else if(r==='level'){S.route='level';}render();});
  if(!opts.nocc){const cc=el('div','tog cc');cc.innerHTML=`<button id="ccBtn" aria-pressed="${S.cc}">${S.cc?'자막 ON':'자막 OFF'}</button>`;cc.querySelector('button').onclick=()=>{S.cc=!S.cc;render();};h.appendChild(cc);}
  const lg=el('div','tog');lg.innerHTML=`<button aria-pressed="${S.lang==='ko'}">한</button><button aria-pressed="${S.lang==='en'}">EN</button>`;
  const [ko,en]=lg.querySelectorAll('button');ko.onclick=()=>{S.lang='ko';render();};en.onclick=()=>{S.lang='en';render();};h.appendChild(lg);
  return h;}
function band(active){const b=el('div','band');STAGES.forEach((s,i)=>{const sp=el('span',i===active?'now':(i<active?'done':''),s);b.appendChild(sp);});return b;}
function foot(o={}){const f=el('div','foot');
  const c=cubi(o.pose||'cubi_stand','cubiSm','cubi-sm');f.appendChild(c);
  const cap=el('div','cap','<span>'+md(o.cap||'')+'</span>');cap.id='cap';if(!S.cc||!o.cap)cap.hidden=true;f.appendChild(cap);
  const bb=el('div','bubble',md(o.say||''));bb.id='bubble';if(!S.cc||!o.say)bb.hidden=true;f.appendChild(bb);
  if(o.mic){const hint=el('div','mic-hint',o.micHint||'');f.appendChild(hint);const m=el('button','mic'+(o.micOn?'':' hide'));m.id='mic';m.setAttribute('aria-label','말하기');m.onclick=o.onMic||null;f.appendChild(m);}
  const n=el('button','next'+(o.nextOn?' on':''),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>');n.setAttribute('aria-label','다음');n.onclick=o.onNext||null;f.appendChild(n);
  return f;}
function setCap(t){const c=$('#cap');if(!c)return;c.innerHTML='<span>'+md(t||'')+'</span>';c.hidden=!S.cc||!t;}
function cubiJump(){const c=$('#cubiBig')||$('#cubiSm');if(!c)return;c.classList.remove('jump');void c.offsetWidth;c.classList.add('jump');}

function renderTown(){app.innerHTML='';app.appendChild(header('',{nocc:true}));
  const b=el('div','body town');

  const lv=el('div','levels');
  LEVELS.forEach((L,i)=>{const open=i<2;const d=el('button','lv'+(open?' open':'')+(i===0?' now':''));

    if(i===0)d.onclick=()=>{S.route='level';render();};else if(open)d.onclick=()=>toast('Level 2는 다음 빌드에서 열려요');
    lv.appendChild(d);});

  const arena=$('#arena');

  const collapseMsg=()=>{$('#ctMsg').textContent=S.lang==='ko'?'✕  순서가 바뀌면 무너져요':'✕  Wrong order — it falls!';$('#ctMsg').classList.add('show');};
  // exec(op,t) schedules one op at offset t (ms) and returns the new offset

    seg=>{if(seg.en){const h=enHooks[enIdx++];if(h)h();}});

}

const norm=t=>t.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();

function diffWords(want,got){const W=norm(want).split(' ').filter(Boolean),G=norm(got).split(' ').filter(Boolean).map(w=>HOMO[w]||w);

  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=W[i]===G[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);

  return {res,ok:res.every(r=>r.t==='ok')&&n===m};}

  S.ss=S.ss||{ok:0,floors:[]};
  const tower=()=>{const t=el('div','card ss-tower');t.innerHTML='<div class="lbl">Stack</div>';for(let k=items.length-1;k>=0;k--){const f=el('div','fl'+(S.ss.floors[k]?' on':''));items[k].blocks.forEach(bl=>f.appendChild(el('i',bl[1])));t.appendChild(f);}t.appendChild(el('div','base'));return t;};
  if(i>=items.length){b.appendChild(el('div','ss-cnt',`<div class="wu-title">Speak &amp; Stack</div>`));const w=el('div','ss-wrap');w.appendChild(el('div','card bb-card',`<div class="bb-done"><img src="${A.eop_ok}" style="height:calc(var(--u)*150px)"><div class="big">${S.ss.ok} / ${items.length}</div><div class="sm">${S.lang==='ko'?'한 번에 말한 문장 · 탑이 쌓였어!':'First-try sentences · Tower stacked!'}</div></div>`));w.appendChild(tower());b.appendChild(w);app.appendChild(b);
    const p=S.progress['L1-B1-U1']||{};p.spoken=items.length;p.acc=Math.round(S.ss.ok/items.length*100);S.progress['L1-B1-U1']=p;save();
    const f=foot({cap:S.lang==='ko'?'말하기 끝! 다음은 Talk to Cubi.':'Speaking done! Next: Talk to Cubi.',nextOn:true,onNext:()=>{S.stage=4;S.idx=0;render();}});f.classList.add('nocubi');app.appendChild(f);SFX.ok();return;}
  const it=items[i];
  b.appendChild(el('div','ss-cnt',`<div class="wu-title">Speak &amp; Stack</div><div class="bb-cnt">${i+1} / ${items.length}</div>`));
  const w=el('div','ss-wrap');const c=el('div','card ss-card');c.innerHTML=`<div class="ko">${it.ko}</div>`;
  const row=el('div','ss-blocks');it.blocks.forEach(bl=>{const d=blk(bl[0],bl[1]);d.classList.add('ghost');row.appendChild(d);});c.appendChild(row);
  const heard=el('div','ss-heard');c.appendChild(heard);w.appendChild(c);w.appendChild(tower());b.appendChild(w);app.appendChild(b);
  let phase='listen',tries=0,rec=null,autoT=null,timer=null;
  const f=foot({cap:T(SS.intro),mic:true,micOn:false,nextOn:false,onMic:()=>{if(phase==='ready')startRec();else if(phase==='rec')stopRec();},onNext:()=>{clearTimeout(autoT);stopSpeech();if(rec)try{rec.abort();}catch(e){}S.idx++;render();}});
  f.classList.add('nocubi');app.appendChild(f);
  const showMic=()=>{phase='ready';$('#mic').classList.remove('hide');SFX.micOn();};
  function startRec(){if(!SR){heard.innerHTML='<span class="ss-nostt">'+(S.lang==='ko'?'이 브라우저는 음성 인식을 지원하지 않아요 (크롬/삼성인터넷에서 열어 주세요)':'Speech recognition not supported here (use Chrome)')+'</span>';$('.next').classList.add('on');return;}
    phase='rec';const m=$('#mic');m.classList.add('rec');SFX.recStart();heard.innerHTML='<span class="lbl">'+(S.lang==='ko'?'듣고 있어요…':'Listening…')+'</span>';
    rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=3;let finalText='',interim='',errored=false;
    rec.onresult=e=>{interim='';for(let k=e.resultIndex;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)finalText+=' '+r[0].transcript;else interim+=r[0].transcript;}heard.innerHTML='<span class="lbl">'+(S.lang==='ko'?'듣고 있어요…':'Listening…')+'</span> '+(finalText+' '+interim).trim();if(finalText.trim())stopRec();};
    rec.onerror=e=>{if(e.error==='aborted')return;errored=true;phase='ready';m.classList.remove('rec');const E={'not-allowed':['마이크 권한을 허용해 주세요','Please allow the microphone'],'service-not-allowed':['이 브라우저에서는 음성 인식을 쓸 수 없어요','Speech service not allowed here'],'network':['인터넷 연결을 확인해 주세요 (음성 인식은 온라인에서만 돼요)','Check your connection (speech needs internet)'],'audio-capture':['마이크를 찾을 수 없어요','No microphone found'],'no-speech':['소리가 안 들렸어. 다시 눌러 봐.',"I didn't hear anything. Tap again."]};const t=E[e.error]||[('잘 못 들었어. 다시 눌러 봐. ('+e.error+')'),("Didn't catch that. Tap again. ("+e.error+')')];heard.innerHTML='<span class="ss-nostt">'+(S.lang==='ko'?t[0]:t[1])+'</span>';};
    rec.onend=()=>{clearTimeout(timer);m.classList.remove('rec');if(!finalText.trim()&&interim.trim())finalText=interim;if(finalText.trim()){grade(finalText.trim());}else{phase='ready';if(!errored)heard.innerHTML='<span class="ss-nostt">'+(S.lang==='ko'?'소리가 안 들렸어. 마이크를 누르고 바로 말해 봐.':"I didn't hear anything. Tap and speak right away.")+'</span>';}};
    try{rec.start();}catch(e){}
    clearTimeout(timer);timer=setTimeout(()=>{if(phase==='rec')stopRec();},6000);
    function stopRecInner(){try{rec.stop();}catch(e){}}
    window.__ssStop=stopRecInner;}
  function stopRec(){if(phase!=='rec')return;phase='grading';const m=$('#mic');m.classList.remove('rec');SFX.recStop();clearTimeout(timer);if(window.__ssStop)window.__ssStop();setTimeout(()=>{if(phase==='grading'){phase='ready';heard.innerHTML='<span class="ss-nostt">'+(S.lang==='ko'?'소리가 안 들렸어. 다시 눌러 봐.':"I didn't hear anything. Tap again.")+'</span>';}},2500);}
  function grade(got){tries++;const {res,ok}=diffWords(it.en,got);
    // paint blocks
    const blks=[...row.children];blks.forEach(d=>d.classList.remove('ghost','okw','badw'));let bi=0;
    res.forEach(r=>{if(r.t==='extra')return;const d=blks[bi++];if(!d)return;if(r.t==='ok')d.classList.add('okw');else d.classList.add('badw');});
    heard.innerHTML='<span class="lbl">'+(S.lang==='ko'?'들은 말':'Heard')+'</span>'+res.map(r=>r.t==='ok'?`<span class="w ok">${r.w}</span>`:r.t==='wrong'?`<span class="w bad">${r.got}</span>`:r.t==='extra'?`<span class="w extra">+${r.w}</span>`:`<span class="miss">${r.w}?</span>`).join(' ');
    if(ok){phase='done';$('#mic').classList.add('hide');SFX.click();setTimeout(SFX.ok,300);if(tries===1)S.ss.ok++;S.ss.floors[i]=true;
      const e=el('div','eop',`<img src="${A.eop_ok}">`);c.appendChild(e);setTimeout(()=>e.remove(),1100);
      const tw=$('.ss-tower');const nf=[...tw.querySelectorAll('.fl')].reverse()[i];if(nf){nf.classList.add('on');}
      setCap(T(SS.feedback.correct));speak(T(SS.feedback.correct)+' **'+it.en+'**',()=>{autoT=setTimeout(()=>{S.idx++;render();},600);});$('.next').classList.add('on');}
    else{SFX.bad();const e=el('div','eop',`<img src="${A.eop_x}">`);c.appendChild(e);setTimeout(()=>e.remove(),900);
      const first=res.find(r=>r.t!=='ok');let msg=T(SS.feedback[first.t]);msg=msg.replace('{w}',first.w||'').replace('{got}',first.got||'').replace('{want}',first.want||'');setCap(msg);
      if(tries>=2){phase='done';$('#mic').classList.add('hide');speak(msg+' **'+it.en+'**',()=>{autoT=setTimeout(()=>{S.idx++;render();},800);});$('.next').classList.add('on');}
      else{phase='ready';speak(msg+' '+(S.lang==='ko'?'다시 말해 봐.':'Try again.'),()=>{});}}}
  // sequence: intro (first item only) → read sentence → mic
  const go=()=>speak('**'+it.en+'**',()=>{row.querySelectorAll('.blk').forEach(d=>d.classList.remove('ghost'));showMic();});
  if(i===0){S.ss={ok:0,floors:[]};speak(T(SS.intro),go);}else go();
}

/* ================= router ================= */
function render(){stopSpeech();if(typeof ctClear==='function')ctClear();
  if(S.route==='town')return renderTown();
  if(S.route==='level')return renderLevel();
  if(S.route==='unit'){if(S.stage===0)return renderWarm();if(S.stage===1)return renderCubiTime();if(S.stage===2)return renderBuild();if(S.stage===3)return renderSpeak();return renderStub(S.stage);}
}
document.addEventListener('pointerdown',()=>ac(),{once:true});
render();
</script>
</body></html>
